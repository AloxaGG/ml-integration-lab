<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iris: проверка признаков</title><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;color:#172033}form{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}label{display:grid;gap:.25rem}input,button{font:inherit;padding:.55rem}button{cursor:pointer;background:#1769aa;color:white;border:0;border-radius:.3rem}.hint{font-size:.82rem;color:#51606d}.card{padding:1rem;background:#f2f6fa;margin:1rem 0}.error{color:#b42318}</style></head>
<body><h1>Проверка входных признаков Iris</h1><p id="health">Проверяем состояние сервиса…</p><p>Диапазоны загружаются из API. Проверка в браузере улучшает интерфейс, но окончательную проверку выполняет сервер.</p><form id="form"></form><p id="error" class="error" role="alert"></p><section id="result" class="card" hidden></section>
<script>
const fieldLabels={sepal_length:'Длина чашелистика',sepal_width:'Ширина чашелистика',petal_length:'Длина лепестка',petal_width:'Ширина лепестка'};const defaults={sepal_length:5.1,sepal_width:3.5,petal_length:1.4,petal_width:.2};const el=id=>document.getElementById(id);
async function request(path,options){const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d;}
function renderForm(profile){const form=el('form');for(const [name,limits] of Object.entries(profile)){const label=document.createElement('label');label.innerHTML=`${fieldLabels[name]}<input name="${name}" type="number" step="any" min="${limits.min}" max="${limits.max}" value="${defaults[name]}" required><span class="hint">Допустимо: ${limits.min}–${limits.max}; среднее: ${limits.mean.toFixed(2)}</span>`;form.append(label);}const button=document.createElement('button');button.textContent='Проверить и спрогнозировать';form.append(button);}
el('form').addEventListener('submit',async e=>{e.preventDefault();el('error').textContent='';const values=Object.fromEntries(new FormData(e.currentTarget));for(const k in values)values[k]=Number(values[k]);try{const r=await request('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});el('result').hidden=false;el('result').innerHTML=`<h2>Прогноз</h2><p>${r.class_name}</p>`;}catch(err){el('result').hidden=true;el('error').textContent=err.message;}});
(async()=>{try{const [profile,health]=await Promise.all([request('/features'),request('/health')]);renderForm(profile);el('health').textContent=health.status==='ok'?'Сервис и модель готовы.':'Сервис недоступен.';}catch(err){el('health').textContent='Не удалось загрузить контракт API: '+err.message;}})();
</script></body></html>
